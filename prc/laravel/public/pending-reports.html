<!DOCTYPE html>
<html lang="en">
<script>
    (function() {
        var role = localStorage.getItem('cw_role');
        if (!role) {
            window.location.replace('index.html');
        } else if (role !== 'super_admin') {
            window.location.replace(role === 'ceo' ? 'offices/ceo/dashboard.html' : 'offices/cenro/dashboard.html');
        }
    })();
</script>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pending Reports — CIVILWATCH Admin</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/navbar.css" />
    <link rel="stylesheet" href="/css/cards.css" />
    <link rel="stylesheet" href="/css/buttons.css" />
    <link rel="stylesheet" href="/css/tables.css" />
    <link rel="stylesheet" href="/css/badges.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <style>
        .pending-stat-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: 18px 22px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
        }

        .pending-stat-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            background: var(--status-pending-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .pending-stat-icon .material-symbols-outlined {
            font-size: 26px;
            color: var(--status-pending);
        }

        .pending-stat-val {
            font-size: 30px;
            font-weight: 700;
            color: var(--gray-900);
        }

        .pending-stat-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-700);
        }

        .pending-stat-sub {
            font-size: 12px;
            color: var(--gray-400);
        }
    </style>
</head>

<body data-page="pending-reports">
    <div class="app-wrapper">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-area" id="mainArea">
            <nav class="navbar" id="navbar"></nav>
            <main class="page-content">

                <!-- Header -->
                <div class="page-header">
                    <h1 class="page-title">Pending Reports</h1>
                    <p class="page-subtitle">Review and validate newly submitted reports.</p>
                </div>

                <!-- Stat -->
                <div class="pending-stat-card">
                    <div class="pending-stat-icon">
                        <span class="material-symbols-outlined">pending_actions</span>
                    </div>
                    <div>
                        <div class="pending-stat-val">24</div>
                        <div class="pending-stat-label">Pending Reports</div>
                        <div class="pending-stat-sub">Reports awaiting validation</div>
                    </div>
                </div>

                <!-- Toolbar -->
                <div class="table-toolbar">
                    <div class="search-input-wrap">
                        <span class="material-symbols-outlined">search</span>
                        <input type="text" class="search-input" id="searchInput" placeholder="Search by issue, location, or reporter..." />
                    </div>
                    <select class="filter-select" id="catFilter">
                        <option value="">All Categories</option>
                        <option value="Infrastructure">Infrastructure</option>
                        <option value="Environmental">Environmental</option>
                    </select>
                    <select class="filter-select" id="brgyFilter">
                        <option value="">All Barangays</option>
                        <option>Aplaya</option>
                        <option>Carmen</option>
                        <option>Zone II</option>
                        <option>Magsaysay</option>
                        <option>Badiang</option>
                        <option>Zone III</option>
                    </select>
                    <div class="date-filter">
                        <span class="material-symbols-outlined">calendar_today</span>
                        May 1, 2025 – May 21, 2026
                    </div>
                </div>

                <!-- Table -->
                <div class="card">
                    <div class="table-container" style="border:none;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>PHOTO</th>
                                    <th>ISSUE</th>
                                    <th>CATEGORY</th>
                                    <th>BARANGAY</th>
                                    <th>SUBMITTED BY</th>
                                    <th>SUBMITTED DATE</th>
                                    <th>ACTIONS</th>
                                </tr>
                            </thead>
                            <tbody id="pendingTableBody"></tbody>
                        </table>
                    </div>
                    <div class="table-footer">
                        <span class="table-showing" id="showingLabel">Showing 1 to 6 of 24 results</span>
                        <div style="display:flex;align-items:center;gap:12px;">
                            <div class="pagination" id="pagination"></div>
                            <select class="per-page-select">
                                <option>10 / page</option>
                                <option>20 / page</option>
                                <option>50 / page</option>
                            </select>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/app.js"></script>
    <script>
        requireAuth();

        // ── State ────────────────────────────────────────────────────────────
        let allReports = []; // full list from API
        let filtered = []; // after search / filter
        let currentPage = 1;
        const perPage = 10;

        // ── Stat counter ──────────────────────────────────────────────────────
        function updateStat(count) {
            const el = document.querySelector('.pending-stat-val');
            if (el) el.textContent = count;
        }

        // ── Render table rows ─────────────────────────────────────────────────
        function render() {
            const tbody = document.getElementById('pendingTableBody');
            const start = (currentPage - 1) * perPage;
            const page = filtered.slice(start, start + perPage);

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                      <td colspan="8" style="text-align:center;padding:40px 20px;color:var(--gray-400);">
                        <span class="material-symbols-outlined" style="font-size:36px;display:block;margin-bottom:8px;">inbox</span>
                        No pending reports found.
                      </td>
                    </tr>`;
                document.getElementById('showingLabel').textContent = 'No results';
                renderPagination();
                return;
            }

            tbody.innerHTML = page.map(r => {
                const citizen = r.citizen || {};
                const name = citizen.fullName || citizen.full_name || '—';
                const phone = citizen.phoneNumber || citizen.phone || '—';
                const date = (r.submittedAt || r.created_at) ?
                    new Date(r.submittedAt || r.created_at).toLocaleDateString('en-PH', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric'
                    }) :
                    '—';
                const time = (r.submittedAt || r.created_at) ?
                    new Date(r.submittedAt || r.created_at).toLocaleTimeString('en-PH', {
                        hour: '2-digit',
                        minute: '2-digit'
                    }) :
                    '';
                const photo = r.imageUrl || r.photo_url;
                const photoCell = photo ?
                    `<img class="table-photo" src="${photo}" alt="${r.issue || r.concern}"
                            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
                            style="display:block"/>
                       <div class="table-photo-placeholder" style="display:none">
                         <span class="material-symbols-outlined">image</span>
                       </div>` :
                    `<div class="table-photo-placeholder">
                         <span class="material-symbols-outlined">image</span>
                       </div>`;

                return `
                <tr data-report-id="${r.id}">
                  <td><span class="ref-id">${r.referenceNumber || r.reference_number || '—'}</span></td>
                  <td>${photoCell}</td>
                  <td>
                    <div class="table-issue">
                      <span class="table-issue-name">${r.issue || r.concern || '—'}</span>
                      <span class="table-issue-desc">${(r.description || '').substring(0, 70)}${(r.description || '').length > 70 ? '…' : ''}</span>
                    </div>
                  </td>
                  <td>${Utils.categoryBadge(r.category)}</td>
                  <td>${r.barangay || '—'}</td>
                  <td>
                    <div class="submitter-cell">
                      <div class="submitter-avatar"><span class="material-symbols-outlined">person</span></div>
                      <div class="submitter-info">
                        <span class="submitter-name">${name}</span>
                        <span class="submitter-phone">${phone}</span>
                      </div>
                    </div>
                  </td>
                  <td>
                    <div style="font-size:13px;color:var(--gray-700)">${date}</div>
                    <div style="font-size:11px;color:var(--gray-400)">${time}</div>
                  </td>
                  <td>
                    <a href="report-details.html?id=${r.id}" class="btn-view">
                      <span class="material-symbols-outlined">visibility</span> View
                    </a>
                  </td>
                </tr>`;
            }).join('');

            const showing = `Showing ${start + 1}–${Math.min(start + perPage, filtered.length)} of ${filtered.length} results`;
            document.getElementById('showingLabel').textContent = showing;
            renderPagination();
        }

        // ── Pagination ────────────────────────────────────────────────────────
        function renderPagination() {
            const total = Math.ceil(filtered.length / perPage);
            const pg = document.getElementById('pagination');
            if (total <= 1) {
                pg.innerHTML = '';
                return;
            }

            let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                          <span class="material-symbols-outlined">chevron_left</span>
                        </button>`;
            for (let i = 1; i <= total; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
            }
            html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === total ? 'disabled' : ''}>
                       <span class="material-symbols-outlined">chevron_right</span>
                     </button>`;
            pg.innerHTML = html;
        }

        function goPage(n) {
            const total = Math.ceil(filtered.length / perPage);
            if (n < 1 || n > total) return;
            currentPage = n;
            render();
        }

        // ── Search + filter ────────────────────────────────────────────────────
        function applyFilter() {
            const q = (document.getElementById('searchInput').value || '').toLowerCase();
            const cat = document.getElementById('catFilter').value;
            const brgy = document.getElementById('brgyFilter').value;
            filtered = allReports.filter(r => {
                const issue = (r.issue || r.concern || '').toLowerCase();
                const barangay = (r.barangay || '').toLowerCase();
                const name = ((r.citizen || {}).fullName || (r.citizen || {}).full_name || '').toLowerCase();
                const matchQ = !q || issue.includes(q) || barangay.includes(q) || name.includes(q);
                const matchCat = !cat || r.category === cat;
                const matchBrgy = !brgy || r.barangay === brgy;
                return matchQ && matchCat && matchBrgy;
            });
            currentPage = 1;
            render();
        }

        const doFilter = Utils.debounce(applyFilter, 250);
        document.getElementById('searchInput').addEventListener('input', doFilter);
        document.getElementById('catFilter').addEventListener('change', applyFilter);
        document.getElementById('brgyFilter').addEventListener('change', applyFilter);

        // ── Load from real API ─────────────────────────────────────────────────
        async function loadPendingReports() {
            // Show skeleton while loading
            Skeleton.injectTableRows('pendingTableBody', 6, 8);
            updateStat('…');

            try {
                // Fetch Submitted + Pending Validation statuses in parallel
                const [subRes, pendRes] = await Promise.all([
                    Api.get('/api/admin/citizen-reports', {
                        status: 'Submitted',
                        limit: 200
                    }),
                    Api.get('/api/admin/citizen-reports', {
                        status: 'Pending Validation',
                        limit: 200
                    }),
                ]);

                const submitted = (subRes && subRes.data && subRes.data.data) ? subRes.data.data : [];
                const pending = (pendRes && pendRes.data && pendRes.data.data) ? pendRes.data.data : [];

                // Merge, de-duplicate by id, sort newest first
                const seen = new Set();
                allReports = [...submitted, ...pending]
                    .filter(r => {
                        if (seen.has(r.id)) return false;
                        seen.add(r.id);
                        return true;
                    })
                    .sort((a, b) => new Date(b.submittedAt || b.created_at) - new Date(a.submittedAt || a.created_at));

                filtered = [...allReports];
                updateStat(allReports.length);
                render();

            } catch (err) {
                document.getElementById('pendingTableBody').innerHTML = `
                    <tr>
                      <td colspan="8" style="text-align:center;padding:40px 20px;color:var(--gray-400);">
                        <span class="material-symbols-outlined" style="font-size:36px;display:block;margin-bottom:8px;">wifi_off</span>
                        Could not load reports. Check your connection.
                      </td>
                    </tr>`;
                updateStat('—');
            }
        }

        // ── Auto-refresh every 30s so new reports appear without manual reload ─
        loadPendingReports();
        setInterval(loadPendingReports, 30000);

        // ── If returning from approval/rejection, reload reports ─────────────
        // Set flag when leaving page (before navigation to report-details or assign-office)
        window.addEventListener('beforeunload', function() {
            sessionStorage.setItem('pending-reports-needs-refresh', 'true');
        });

        // Check if we're returning from approval workflow
        if (sessionStorage.getItem('pending-reports-needs-refresh') === 'true') {
            sessionStorage.removeItem('pending-reports-needs-refresh');
            loadPendingReports(); // Reload to remove approved reports
        }

        // Also listen for storage changes (if user approved in another tab)
        window.addEventListener('storage', function(e) {
            if (e.key === 'report-approved' && e.newValue === 'true') {
                loadPendingReports();
                localStorage.removeItem('report-approved');
            }
        });
    </script>
</body>

</html>
